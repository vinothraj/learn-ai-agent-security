# Local Postgres for the API (optional; without it the API uses embedded PGlite).
#   docker compose -f infra/docker-compose.yml up -d
#   DATABASE_URL=postgres://laas:laas@localhost:5432/laas npm run dev --workspace apps/api
#   TEST_DATABASE_URL=postgres://laas:laas@localhost:5432/laas_test npm test --workspace apps/api
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laas
      POSTGRES_PASSWORD: laas
      POSTGRES_DB: laas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laas"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
